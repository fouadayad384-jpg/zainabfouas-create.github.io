
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>زينبي وفوفو - النسخة النهائية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, getDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrLUiTNZL3vJ10RzqQVBC2UUMlhQRmB18",
            authDomain: "arenstore-71e49.firebaseapp.com",
            projectId: "arenstore-71e49",
            storageBucket: "arenstore-71e49.firebasestorage.app",
            messagingSenderId: "221262833085",
            appId: "1:221262833085:web:68e17371c7100e1053ded4",
            measurementId: "G-1Q957K0Y1V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = 'zf_ultimate_v9';

        let user = null;
        let gameId = null;
        let myRole = 'z'; 
        let isHost = false;
        let isBotMode = false;
        let unsubscribe = null;
        let currentData = null;
        let transitionLocked = false;
        let botInterval = null;

        const words = ["أحبك جداً", "بطل القصة", "سريع البرق", "ذكاء خارق", "تحدي كبير", "بغداد السلام", "نصر قريب", "قوة الإرادة", "مستقبل باهر", "صداقة أبدية", "فوز مستحق", "لعبة ممتعة", "تركيز عال", "كتابة سريعة", "إبداع بلا حدود"];

        onAuthStateChanged(auth, (u) => { 
            if (u) { user = u; document.getElementById('loading').classList.add('hidden'); }
            else { signInAnonymously(auth); }
        });

        window.startBotMode = () => {
            isBotMode = true; isHost = true; myRole = 'z'; transitionLocked = false;
            currentData = {
                gameType: 'none', status: 'playing',
                xo: { board: Array(9).fill(""), turn: "z" },
                speed: { score: 50, winner: null },
                dots: { lines: [], boxes: [], turn: 'z', scores: { z: 0, f: 0 } },
                typing: { currentWord: words[0], scores: { z: 0, f: 0 }, messages: [] },
                chat: []
            };
            showView('game-selector');
            startBotLogic();
        };

        window.createRoom = async () => {
            isBotMode = false; transitionLocked = false;
            const rid = Math.floor(1000 + Math.random() * 9999).toString();
            gameId = `room_${rid}`; myRole = 'z'; isHost = true;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), {
                roomId: rid, z_id: user.uid, status: 'waiting', gameType: 'none',
                xo: { board: Array(9).fill(""), turn: "z" },
                speed: { score: 50, winner: null },
                dots: { lines: [], boxes: [], turn: 'z', scores: { z: 0, f: 0 } },
                typing: { currentWord: words[Math.floor(Math.random()*words.length)], scores: { z: 0, f: 0 }, messages: [] },
                chat: []
            });
            document.getElementById('room-id').innerText = rid;
            showView('waiting-room'); listen();
        };

        window.joinRoom = async () => {
            const rid = document.getElementById('room-input').value; if (!rid) return;
            gameId = `room_${rid}`;
            const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId));
            if (snap.exists()) { myRole = 'f'; isHost = false; await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), { f_id: user.uid, status: 'lobby' }); listen(); }
            else alert("الغرفة غير موجودة");
        };

        function listen() {
            if (unsubscribe) unsubscribe();
            unsubscribe = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), (s) => {
                if (!s.exists()) { exit(); return; }
                const newData = s.data();
                currentData = newData;
                if (currentData.status === 'lobby') showView('game-selector');
                else if (currentData.status === 'playing') renderGame();
            });
        }

        function showView(id) {
            ['main-menu', 'waiting-room', 'game-selector', 'game-view'].forEach(v => document.getElementById(v)?.classList.add('hidden'));
            document.getElementById(id)?.classList.remove('hidden');
        }

        window.selectGame = async (type) => {
            transitionLocked = false;
            const init = {
                gameType: type, status: 'playing',
                xo: { board: Array(9).fill(""), turn: "z" },
                speed: { score: 50, winner: null },
                dots: { lines: [], boxes: [], turn: 'z', scores: { z: 0, f: 0 } },
                typing: { currentWord: words[Math.floor(Math.random()*words.length)], scores: { z: 0, f: 0 }, messages: [] }
            };
            if (isBotMode) { currentData = {...currentData, ...init}; renderGame(); return; }
            if (isHost) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), init);
        };

        function renderGame() {
            showView('game-view');
            const t = currentData.gameType;
            if (t === 'typing') renderTyping();
            else if (t === 'speed') renderSpeed();
            else if (t === 'dots') renderDots();
            else if (t === 'xo') renderXO();
            else if (t === 'none') showView('game-selector');
        }

        // --- Typing Challenge (Telegram Layout) ---
        function renderTyping() {
            const t = currentData.typing;
            if (t.scores.z >= 15 || t.scores.f >= 15) {
                const winner = t.scores.z >= 15 ? 'زينبي' : 'فوفو';
                document.getElementById('content').innerHTML = `<div class="text-center py-20"><h2 class="text-5xl font-black text-yellow-400 animate-bounce">فوز ${winner} باللقب! 👑</h2></div>`;
                setTimeout(() => selectGame('none'), 3000);
                return;
            }

            document.getElementById('content').innerHTML = `
                <div class="flex flex-col h-full w-full max-w-lg bg-[#0e1621] rounded-3xl border border-white/10 shadow-2xl overflow-hidden">
                    <div class="bg-[#17212b] p-4 flex justify-between items-center border-b border-black">
                        <div class="flex gap-4">
                            <span class="text-pink-500 font-black">Z: ${t.scores.z}</span>
                            <span class="text-cyan-500 font-black">F: ${t.scores.f}</span>
                        </div>
                        <div class="text-xs text-blue-400 font-bold tracking-widest uppercase">الهدف: 15 نقطة</div>
                    </div>
                    
                    <!-- Fixed Target Word -->
                    <div class="bg-[#1c2938] py-4 text-center border-b border-blue-500/20">
                        <p class="text-[10px] text-slate-500 mb-1 uppercase font-bold">الكلمة المطلوبة</p>
                        <div class="text-3xl font-black text-white px-6 inline-block rounded-xl">${t.currentWord}</div>
                    </div>

                    <div id="typing-chat-body" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col">
                        ${t.messages.map(m => `
                            <div class="flex ${m.role === myRole ? 'justify-start' : 'justify-end'}">
                                <div class="${m.role === 'z' ? 'bg-pink-700' : 'bg-cyan-700'} text-white px-4 py-2 rounded-2xl shadow-lg text-sm max-w-[85%]">
                                    ${m.text}
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="bg-[#17212b] p-4 flex gap-2">
                        <input id="chat-type-input" type="text" autocomplete="off" placeholder="اكتب الكلمة هنا..." 
                            class="flex-1 bg-[#242f3d] text-white rounded-full px-6 py-3 outline-none focus:ring-2 ring-blue-500/50">
                        <button onclick="sendTypingMsg()" class="bg-blue-600 text-white p-3 rounded-full shadow-lg active:scale-90 transition-all">
                            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                        </button>
                    </div>
                </div>
            `;
            const chatBody = document.getElementById('typing-chat-body');
            chatBody.scrollTop = chatBody.scrollHeight;
            document.getElementById('chat-type-input').focus();
        }

        window.sendTypingMsg = async () => {
            const input = document.getElementById('chat-type-input');
            const val = input.value.trim();
            if (!val) return;
            
            const t = currentData.typing;
            const isCorrect = val === t.currentWord;
            
            const newMsg = { role: myRole, text: val, time: Date.now() };
            t.messages.push(newMsg);
            if (t.messages.length > 20) t.messages.shift();

            if (isCorrect) {
                t.scores[myRole]++;
                t.currentWord = words[Math.floor(Math.random() * words.length)];
            }

            if (isBotMode) renderTyping();
            else await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), { typing: t });
            input.value = "";
        };

        // --- Perfect Grid Dots & Boxes ---
        function renderDots() {
            const d = currentData.dots; 
            const size = 5; 
            const gap = 64; 
            const offset = 40;
            const boxSize = gap - 4;

            let html = `
                <div class="flex flex-col items-center">
                    <div class="flex justify-between w-full max-w-[320px] mb-8 font-black bg-slate-900 p-4 rounded-3xl border border-white/5">
                        <div class="text-pink-500">زينبي: ${d.scores.z}</div>
                        <div class="text-xs ${d.turn === myRole ? 'text-green-400 animate-pulse' : 'text-slate-500'} italic">${d.turn === myRole ? 'دورك' : 'انتظر...'}</div>
                        <div class="text-cyan-500">فوفو: ${d.scores.f}</div>
                    </div>

                    <div class="relative bg-slate-950 p-4 rounded-[40px] border border-white/5" style="width: ${size*gap+20}px; height: ${size*gap+20}px;">
            `;

            // Boxes
            for(let r=0; r<4; r++) for(let c=0; c<4; c++) {
                const o = d.boxes.find(b => b.id === `b-${r}-${c}`)?.owner;
                if(o) {
                    html += `<div class="absolute flex items-center justify-center font-black rounded-xl transition-all duration-300" 
                        style="top:${r*gap+offset+6}px; left:${c*gap+offset+6}px; width:${boxSize-8}px; height:${boxSize-8}px; 
                        background:${o==='z'?'rgba(236,72,153,0.3)':'rgba(6,182,212,0.3)'}; border:1px solid ${o==='z'?'#ec4899':'#06b6d4'};">
                        <span class="text-xl ${o==='z'?'text-pink-300':'text-cyan-300'}">${o==='z'?'Z':'F'}</span>
                    </div>`;
                }
            }

            // Horizontal Lines
            for(let r=0; r<size; r++) for(let c=0; c<size-1; c++) {
                const t = d.lines.includes(`h-${r}-${c}`);
                html += `<div onclick="clickLine('h-${r}-${c}')" class="absolute cursor-pointer group" 
                    style="top:${r*gap+offset-4}px; left:${c*gap+offset+10}px; width:${gap-20}px; height:12px; z-index:10;">
                    <div class="w-full h-full rounded-full transition-all duration-200 ${t ? 'bg-white shadow-[0_0_10px_white]' : 'bg-white/5 group-hover:bg-white/20'}"></div>
                </div>`;
            }

            // Vertical Lines
            for(let r=0; r<size-1; r++) for(let c=0; c<size; c++) {
                const t = d.lines.includes(`v-${r}-${c}`);
                html += `<div onclick="clickLine('v-${r}-${c}')" class="absolute cursor-pointer group" 
                    style="top:${r*gap+offset+10}px; left:${c*gap+offset-4}px; width:12px; height:${gap-20}px; z-index:10;">
                    <div class="w-full h-full rounded-full transition-all duration-200 ${t ? 'bg-white shadow-[0_0_10px_white]' : 'bg-white/5 group-hover:bg-white/20'}"></div>
                </div>`;
            }

            // Dots (Perfectly Centered)
            for(let r=0; r<size; r++) for(let c=0; c<size; c++) {
                html += `<div class="absolute bg-slate-400 w-3 h-3 rounded-full pointer-events-none shadow-[0_0_5px_black]" 
                    style="top:${r*gap+offset-1}px; left:${c*gap+offset-1}px; z-index:20;"></div>`;
            }

            html += `</div></div>`;
            document.getElementById('content').innerHTML = html;
        }

        window.clickLine = async (l) => {
            const d = currentData.dots; if(d.turn!==myRole || d.lines.includes(l)) return;
            d.lines.push(l); let cl = false;
            for(let r=0; r<4; r++) for(let c=0; c<4; c++) {
                if(!d.boxes.find(b=>b.id===`b-${r}-${c}`) && [`h-${r}-${c}`,`h-${r+1}-${c}`,`v-${r}-${c}`,`v-${r}-${c+1}`].every(x=>d.lines.includes(x))) { 
                    d.boxes.push({id:`b-${r}-${c}`,owner:myRole}); 
                    d.scores[myRole]++; cl=true; 
                }
            }
            if(!cl) d.turn = (myRole==='z'?'f':'z');
            if(isBotMode) renderDots(); else await updateDoc(doc(db,'artifacts',appId,'public', 'data', 'matches', gameId), {dots:d});
        };

        // --- Bot Logic ---
        function startBotLogic() {
            if (botInterval) clearInterval(botInterval);
            botInterval = setInterval(() => {
                if (!isBotMode || transitionLocked || !currentData) return;

                if (currentData.gameType === 'typing' && Math.random() > 0.8) {
                    const target = currentData.typing.currentWord;
                    currentData.typing.messages.push({ role: 'f', text: target, time: Date.now() });
                    currentData.typing.scores.f++;
                    currentData.typing.currentWord = words[Math.floor(Math.random()*words.length)];
                    renderTyping();
                }

                if (currentData.gameType === 'dots' && currentData.dots.turn === 'f') {
                    const size = 5;
                    const possible = [];
                    for(let r=0; r<size; r++) for(let c=0; c<size-1; c++) if(!currentData.dots.lines.includes(`h-${r}-${c}`)) possible.push(`h-${r}-${c}`);
                    for(let r=0; r<size-1; r++) for(let c=0; c<size; c++) if(!currentData.dots.lines.includes(`v-${r}-${c}`)) possible.push(`v-${r}-${c}`);
                    if (possible.length > 0) {
                        const l = possible[Math.floor(Math.random()*possible.length)];
                        currentData.dots.lines.push(l);
                        let cl = false;
                        for(let r=0; r<4; r++) for(let c=0; c<4; c++) {
                            if(!currentData.dots.boxes.find(b=>b.id===`b-${r}-${c}`) && [`h-${r}-${c}`,`h-${r+1}-${c}`,`v-${r}-${c}`,`v-${r}-${c+1}`].every(x=>currentData.dots.lines.includes(x))) { 
                                d.boxes.push({id:`b-${r}-${c}`,owner:'f'}); 
                                d.scores.f++; cl=true; 
                            }
                        }
                        if(!cl) currentData.dots.turn = 'z';
                        renderDots();
                    }
                }
            }, 1500);
        }

        // --- Speed & XO Re-render ---
        function renderSpeed() {
            const s = currentData.speed;
            if (s.winner && !transitionLocked) {
                transitionLocked = true;
                const winName = s.winner === 'z' ? 'زينبي' : 'فوفو';
                document.getElementById('content').innerHTML = `<div class="text-center py-20"><h2 class="text-5xl font-black text-cyan-400 animate-pulse">فوز ${winName}! 🔥</h2></div>`;
                setTimeout(() => selectGame('none'), 3000); return;
            }
            document.getElementById('content').innerHTML = `
                <div class="relative w-full max-w-md h-32 bg-slate-900 rounded-[3rem] p-4 border-4 border-white/5 overflow-hidden mb-12 shadow-2xl">
                    <div class="absolute h-full top-0 bg-gradient-to-l from-pink-500 via-purple-500 to-cyan-500 transition-all duration-150" style="width: ${s.score}%; left: 0;"></div>
                    <div class="absolute inset-0 flex items-center justify-between px-10 font-black italic text-white mix-blend-difference"><span>ZINABI</span> <span>FOFO</span></div>
                </div>
                <button id="tap-btn" class="w-64 h-64 bg-red-600 rounded-full shadow-[0_20px_0px_#7f1d1d] active:shadow-none active:translate-y-[20px] flex items-center justify-center text-7xl select-none transition-all">🥊</button>
            `;
            const btn = document.getElementById('tap-btn');
            const hit = async (e) => {
                e.preventDefault();
                let val = currentData.speed.score + (myRole === 'z' ? -4 : 4);
                let win = null;
                if (val <= 0) { val = 0; win = 'z'; }
                if (val >= 100) { val = 100; win = 'f'; }
                if (isBotMode) { currentData.speed.score = val; currentData.speed.winner = win; renderSpeed(); }
                else await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), { "speed.score": val, "speed.winner": win });
            };
            btn.onmousedown = hit; btn.ontouchstart = hit;
        }

        function renderXO() {
            const xo = currentData.xo;
            const win = checkWinnerXO(xo.board);
            if (win && !transitionLocked) {
                transitionLocked = true;
                const msg = win === 'draw' ? "تعادل!" : `فوز ${win === 'z' ? 'زينبي' : 'فوفو'}!`;
                document.getElementById('content').innerHTML = `<div class="text-center py-20"><h2 class="text-5xl font-black text-pink-500">${msg}</h2></div>`;
                setTimeout(() => selectGame('none'), 2500); return;
            }
            let html = `<div class="mb-10 text-center font-black text-2xl ${xo.turn === myRole ? 'text-green-400' : 'text-slate-600'}">${xo.turn === myRole ? 'دورك للعب' : 'انتظر الخصم'}</div>`;
            html += `<div class="grid grid-cols-3 gap-6 w-80 mx-auto">`;
            xo.board.forEach((cell, i) => {
                html += `<button onclick="playXO(${i})" class="h-24 bg-slate-900 border border-white/10 rounded-3xl text-5xl font-black shadow-2xl active:scale-90 transition-all">${cell === 'z' ? '❌' : (cell === 'f' ? '⭕' : '')}</button>`;
            });
            html += `</div>`;
            document.getElementById('content').innerHTML = html;
        }

        window.playXO = async (i) => {
            if (transitionLocked || currentData.xo.turn !== myRole || currentData.xo.board[i] !== "") return;
            const b = [...currentData.xo.board]; b[i] = myRole;
            const t = myRole === 'z' ? 'f' : 'z';
            if (isBotMode) { currentData.xo.board = b; currentData.xo.turn = t; renderXO(); }
            else await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), { "xo.board": b, "xo.turn": t });
        };

        function checkWinnerXO(board) {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let w of wins) if (board[w[0]] && board[w[0]] === board[w[1]] && board[w[0]] === board[w[2]]) return board[w[0]];
            return board.includes("") ? null : "draw";
        }

        window.exit = () => { gameId=null; isBotMode=false; if(botInterval) clearInterval(botInterval); showView('main-menu'); };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: white; overflow: hidden; touch-action: none; -webkit-tap-highlight-color: transparent; }
        .btn-game { @apply py-6 bg-slate-900 border border-white/5 rounded-[2.5rem] font-black flex flex-col items-center gap-3 active:scale-95 transition-all shadow-xl; }
        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body class="h-screen flex items-center justify-center overflow-hidden">

    <div id="loading" class="fixed inset-0 z-[3000] bg-slate-950 flex items-center justify-center text-pink-500">
        <div class="w-12 h-12 border-4 border-current border-t-transparent rounded-full animate-spin"></div>
    </div>

    <div id="main-menu" class="w-full max-w-sm p-8 text-center animate-in fade-in zoom-in duration-500">

        <button onclick="startBotMode()" class="w-full py-6 bg-white text-slate-950 rounded-[2.5rem] font-black text-2xl shadow-2xl mb-8 active:scale-95 transition-all">🤖 العب ضد البوت</button>

                <span class="text-4xl">💬</span>
                <span>تحدي الكتابة (15 نقطة)</span>
            </button>
            <button onclick="selectGame('dots')" class="btn-game border-orange-500/20">
                <span class="text-4xl">📐</span>
                <span>المربعات (دقة عالية)</span>
            </button>
            <button onclick="selectGame('speed')" class="btn-game border-red-500/20">
                <span class="text-4xl">🥊</span>
                <span>تحدي الضغط</span>
            </button>
            <button onclick="selectGame('xo')" class="btn-game border-pink-500/20">
                <span class="text-4xl">❌</span>
                <span>لعبة إكس أوه</span>
            </button>
        </div>
    </div>

    <div id="game-view" class="hidden fixed inset-0 flex flex-col items-center justify-center bg-[#020617] h-full overflow-hidden">

            <button onclick="exit()" class="bg-white/5 px-6 py-2 rounded-full text-[10px] font-black border border-white/10 uppercase italic">↩ خروج</button>
            <div class="text-[10px] text-slate-600 font-black tracking-widest uppercase">Z & F Arena</div>
        </div>
        <div id="content" class="w-full h-full flex flex-col items-center justify-center p-4"></div>
    </div>

</body>
