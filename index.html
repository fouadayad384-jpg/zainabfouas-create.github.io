

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>زينبي و فوفو - أونلاين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // إعدادات Firebase
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'zenabi-fofo-final-v1';

        let user = null;
        let gameId = null;
        let myRole = null; 
        let gameState = { status: 'none', ball: { x: 140, y: 180, vx: 4, vy: 4 }, scores: { z: 0, f: 0 } };
        let isHost = false;

        // نظام الأصوات البسيط
        const playSfx = (freq) => {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.frequency.value = freq;
            g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.1);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
        };

        // تسجيل الدخول المجهول
        onAuthStateChanged(auth, (u) => { 
            if (u) {
                user = u;
                document.getElementById('loading-overlay').classList.add('hidden');
            } else {
                signInAnonymously(auth).catch(err => console.error("Auth Error:", err));
            }
        });

        // إنشاء الغرفة
        window.createRoom = async () => {
            if (!user) return;
            const rid = Math.floor(1000 + Math.random() * 9000).toString();
            gameId = `room_${rid}`;
            myRole = 'z';
            isHost = true;

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), {
                    roomId: rid,
                    z_id: user.uid,
                    f_id: null,
                    status: 'waiting',
                    scores: { z: 0, f: 0 },
                    ball: { x: 140, y: 180, vx: 4, vy: 4 },
                    lastUpdate: serverTimestamp()
                });
                document.getElementById('room-id-display').innerText = rid;
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('waiting-lobby').classList.remove('hidden');
                listenToGame();
            } catch (e) {
                alert("تأكد من تفعيل Firestore Rules و Anonymous Auth");
            }
        };

        // الانضمام للغرفة
        window.joinRoom = async () => {
            const rid = document.getElementById('room-input').value;
            if (!rid) return;
            const gid = `room_${rid}`;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'matches', gid);
            
            const snap = await getDoc(docRef);
            if (snap.exists()) {
                gameId = gid;
                myRole = 'f';
                isHost = false;
                await updateDoc(docRef, { f_id: user.uid, status: 'playing' });
                listenToGame();
            } else {
                alert("الغرفة غير موجودة!");
            }
        };

        function listenToGame() {
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), (snapshot) => {
                if (!snapshot.exists()) return;
                gameState = snapshot.data();
                if (gameState.status === 'playing') {
                    document.getElementById('lobby-container').classList.add('hidden');
                    document.getElementById('game-screen').classList.remove('hidden');
                    render();
                }
            });
        }

        function render() {
            document.getElementById('z-score').innerText = gameState.scores.z;
            document.getElementById('f-score').innerText = gameState.scores.f;
            document.getElementById('role-tag').innerText = myRole === 'z' ? "أنتِ زينبي (أسفل)" : "أنت فوفو (أعلى)";
            const ball = document.getElementById('ball');
            ball.style.transform = `translate(${gameState.ball.x}px, ${gameState.ball.y}px)`;
        }

        // محرك الحركة (المستضيف فقط)
        setInterval(async () => {
            if (isHost && gameState.status === 'playing') {
                let b = gameState.ball;
                b.x += b.vx; b.y += b.vy;
                if (b.x <= 0 || b.x >= 280) b.vx *= -1;
                
                if (b.y <= 0) { // هدف لزينبي
                    gameState.scores.z++;
                    b = { x: 140, y: 180, vx: 4, vy: 4 };
                    playSfx(800);
                }
                if (b.y >= 380) { // هدف لفوفو
                    gameState.scores.f++;
                    b = { x: 140, y: 180, vx: 4, vy: -4 };
                    playSfx(400);
                }
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), {
                    ball: b,
                    scores: gameState.scores
                });
            }
        }, 50);

        // ضرب الكرة
        window.kick = async () => {
            if (gameState.status !== 'playing') return;
            let b = gameState.ball;
            let canHit = false;
            if (myRole === 'z' && b.y > 280 && b.vy > 0) canHit = true;
            if (myRole === 'f' && b.y < 80 && b.vy < 0) canHit = true;

            if (canHit) {
                b.vy *= -1.1;
                b.vx += (Math.random() - 0.5) * 5;
                playSfx(600);
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), { ball: b });
            }
        };

        window.copyRoom = () => {
            const rid = document.getElementById('room-id-display').innerText;
            navigator.clipboard.writeText(rid);
            alert("تم نسخ الرقم: " + rid);
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: white; overflow: hidden; touch-action: none; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        #ball { position: absolute; width: 40px; height: 40px; background: white; border-radius: 50%; box-shadow: 0 0 20px #fff; z-index: 100; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: transform 0.05s linear; }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center">

    <div id="loading-overlay" class="fixed inset-0 z-[2000] bg-slate-950 flex flex-col items-center justify-center">
        <div class="w-10 h-10 border-4 border-pink-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-xs font-bold animate-pulse uppercase tracking-widest">جاري الاتصال بالسيرفر...</p>
    </div>

    <div id="lobby-container" class="fixed inset-0 z-[1000] bg-slate-950 flex flex-col items-center justify-center p-6">
        <div id="main-menu" class="w-full max-w-sm text-center">
            <h1 class="text-6xl font-black mb-10 italic bg-gradient-to-r from-pink-500 to-cyan-500 bg-clip-text text-transparent">زينبي و فوفو</h1>
            <button onclick="createRoom()" class="w-full py-5 bg-pink-600 rounded-3xl font-black text-xl mb-6 shadow-xl active:scale-95 transition-all">إنشاء غرفة خاصة</button>
            <div class="flex gap-2">
                <input id="room-input" type="number" placeholder="رقم الغرفة" class="flex-1 bg-slate-900 border border-slate-800 rounded-3xl px-6 py-4 text-center font-bold text-xl outline-none focus:border-cyan-500">
                <button onclick="joinRoom()" class="px-8 py-4 bg-cyan-600 rounded-3xl font-black active:scale-95 transition-all">انضمام</button>
            </div>
        </div>

        <div id="waiting-lobby" class="hidden text-center w-full max-w-sm">
            <div class="glass p-10 rounded-[40px] mb-8 border border-white/5">
                <p class="text-slate-400 text-sm mb-4">رقم الغرفة هو</p>
                <h2 id="room-id-display" class="text-7xl font-black text-white tracking-widest mb-6 tabular-nums">0000</h2>
                <button onclick="copyRoom()" class="text-cyan-400 font-bold text-sm underline">نسخ الرقم وإرساله لصديقك</button>
            </div>
            <p class="animate-pulse text-pink-400 font-bold">بانتظار فوفو يدخل الغرفة...</p>
        </div>
    </div>

    <div id="game-screen" class="hidden w-full max-w-md h-full flex flex-col p-6 animate-in fade-in duration-700">
        <header class="flex justify-between items-center mb-10">
            <div class="glass px-6 py-3 rounded-2xl border-b-4 border-pink-500 text-center min-w-[100px]">
                <div class="text-[10px] text-pink-500 font-bold uppercase mb-1">زينبي</div>
                <div id="z-score" class="text-3xl font-black italic leading-none">0</div>
            </div>
            <div class="text-center">
                <div id="role-tag" class="text-[10px] font-bold text-white mb-2 px-4 py-1 glass rounded-full border border-white/10 uppercase tracking-tighter">جاري التحميل..</div>
            </div>
            <div class="glass px-6 py-3 rounded-2xl border-b-4 border-cyan-500 text-center min-w-[100px]">
                <div class="text-[10px] text-cyan-500 font-bold uppercase mb-1">فوفو</div>
                <div id="f-score" class="text-3xl font-black italic leading-none">0</div>
            </div>
        </header>

        <main class="flex-1 flex items-center justify-center relative touch-none" onmousedown="kick()" ontouchstart="kick()">
            <div id="arena" class="w-full max-w-[320px] h-[400px] bg-slate-900/40 rounded-[60px] relative border border-white/5 overflow-hidden shadow-2xl">
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-2 bg-cyan-500 shadow-[0_5px_15px_#06b6d4] rounded-b-xl"></div>
                <div id="ball">⚽</div>
                <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-32 h-2 bg-pink-500 shadow-[0_-5px_15px_#ec4899] rounded-t-xl"></div>
                <div class="absolute top-1/2 left-0 w-full h-[1px] bg-white/5"></div>
            </div>
        </main>

        <footer class="p-8 text-center text-slate-500 text-xs font-bold uppercase tracking-[0.2em]">
            المس الشاشة لضرب الكرة
        </footer>
    </div>

</body>
</html>

```
