
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>زينبي و فوفو - Arenstore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        // استيراد المكتبات بشكل صحيح للمتصفح (CDN)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // إعدادات Arenstore الخاصة بك التي أرسلتها
        const firebaseConfig = {
            apiKey: "AIzaSyCrLUiTNZL3vJ10RzqQVBC2UUMlhQRmB18",
            authDomain: "arenstore-71e49.firebaseapp.com",
            projectId: "arenstore-71e49",
            storageBucket: "arenstore-71e49.firebasestorage.app",
            messagingSenderId: "221262833085",
            appId: "1:221262833085:web:68e17371c7100e1053ded4",
            measurementId: "G-1Q957K0Y1V"
        };

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = 'arenstore_game_v1';

        let user = null;
        let gameId = null;
        let myRole = null; 
        let gameState = { status: 'none', ball: { x: 140, y: 180, vx: 4, vy: 4 }, scores: { z: 0, f: 0 } };
        let isHost = false;

        // الدخول المجهول (تأكد من تفعيله في Firebase Console كما فعلنا سابقاً)
        onAuthStateChanged(auth, (u) => { 
            if (u) {
                user = u;
                document.getElementById('loading-overlay').classList.add('hidden');
                console.log("Logged in as:", u.uid);
            } else {
                signInAnonymously(auth).catch(err => {
                    console.error("Auth Error:", err);
                    document.getElementById('loading-msg').innerText = "فشل الاتصال! تأكد من تفعيل Anonymous Auth في Firebase";
                });
            }
        });

        // إنشاء غرفة
        window.createRoom = async () => {
            if (!user) return alert("جاري الاتصال بالسيرفر، انتظر ثواني...");
            const rid = Math.floor(1000 + Math.random() * 9000).toString();
            gameId = `room_${rid}`;
            myRole = 'z';
            isHost = true;

            try {
                // استخدام المسار الصحيح حسب الـ Rules التي وضعناها
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId);
                await setDoc(roomRef, {
                    roomId: rid,
                    z_id: user.uid,
                    f_id: null,
                    status: 'waiting',
                    scores: { z: 0, f: 0 },
                    ball: { x: 140, y: 180, vx: 4, vy: 4 },
                    lastUpdate: serverTimestamp()
                });
                
                document.getElementById('room-id-display').innerText = rid;
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('waiting-lobby').classList.remove('hidden');
                listenToGame();
            } catch (e) {
                console.error("Create Error:", e);
                alert("حدث خطأ! تأكد من القواعد (Rules) في Firebase.");
            }
        };

        // انضمام لغرفة
        window.joinRoom = async () => {
            const rid = document.getElementById('room-input').value;
            if (!rid) return alert("ادخل رقم الغرفة");
            const gid = `room_${rid}`;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'matches', gid);
            
            try {
                const snap = await getDoc(docRef);
                if (snap.exists()) {
                    gameId = gid;
                    myRole = 'f';
                    isHost = false;
                    await updateDoc(docRef, { f_id: user.uid, status: 'playing' });
                    listenToGame();
                } else {
                    alert("الغرفة غير موجودة!");
                }
            } catch(e) { 
                console.error("Join Error:", e);
                alert("تعذر الانضمام للغرفة."); 
            }
        };

        function listenToGame() {
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), (snapshot) => {
                if (!snapshot.exists()) return;
                gameState = snapshot.data();
                if (gameState.status === 'playing') {
                    document.getElementById('lobby-container').classList.add('hidden');
                    document.getElementById('game-screen').classList.remove('hidden');
                    render();
                }
            });
        }

        function render() {
            document.getElementById('z-score').innerText = gameState.scores.z;
            document.getElementById('f-score').innerText = gameState.scores.f;
            document.getElementById('role-tag').innerText = myRole === 'z' ? "أنتِ زينبي (الأسفل)" : "أنت فوفو (الأعلى)";
            const ball = document.getElementById('ball');
            ball.style.transform = `translate(${gameState.ball.x}px, ${gameState.ball.y}px)`;
        }

        // محرك الكرة
        setInterval(async () => {
            if (isHost && gameState.status === 'playing') {
                let b = gameState.ball;
                b.x += b.vx; b.y += b.vy;

                if (b.x <= 0 || b.x >= 280) b.vx *= -1;
                
                if (b.y <= 0) { // هدف لزينبي
                    gameState.scores.z++;
                    b = { x: 140, y: 180, vx: 4, vy: 4 };
                }
                if (b.y >= 380) { // هدف لفوفو
                    gameState.scores.f++;
                    b = { x: 140, y: 180, vx: 4, vy: -4 };
                }

                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId);
                await updateDoc(docRef, { ball: b, scores: gameState.scores });
            }
        }, 60);

        window.kick = async () => {
            if (gameState.status !== 'playing') return;
            let b = gameState.ball;
            let canHit = (myRole === 'z' && b.y > 280 && b.vy > 0) || (myRole === 'f' && b.y < 80 && b.vy < 0);

            if (canHit) {
                b.vy *= -1.1;
                b.vx += (Math.random() - 0.5) * 5;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId);
                await updateDoc(docRef, { ball: b });
            }
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: white; overflow: hidden; touch-action: none; }
        .neon-btn { @apply w-full py-5 rounded-3xl font-black text-xl transition-all active:scale-95; }
        #ball { position: absolute; width: 40px; height: 40px; background: white; border-radius: 50%; box-shadow: 0 0 20px #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: transform 0.06s linear; }
    </style>
</head>
<body class="h-screen flex items-center justify-center">

    <div id="loading-overlay" class="fixed inset-0 z-[2000] bg-slate-950 flex flex-col items-center justify-center">
        <div class="w-10 h-10 border-4 border-pink-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p id="loading-msg" class="text-xs font-bold uppercase tracking-widest">جاري ربط Arenstore...</p>
    </div>

    <div id="lobby-container" class="w-full max-w-sm p-6 text-center">
        <div id="main-menu">
            <h1 class="text-5xl font-black mb-12 italic bg-gradient-to-r from-pink-500 to-cyan-500 bg-clip-text text-transparent">زينبي و فوفو</h1>
            <button onclick="createRoom()" class="neon-btn bg-pink-600 shadow-lg shadow-pink-900/40 mb-6">إنشاء غرفة جديدة</button>
            <div class="flex gap-2">
                <input id="room-input" type="number" placeholder="رقم الغرفة" class="flex-1 bg-slate-900 border border-slate-800 rounded-3xl px-6 py-4 text-center font-bold text-xl outline-none focus:border-cyan-500">
                <button onclick="joinRoom()" class="px-6 py-4 bg-cyan-600 rounded-3xl font-black">انضمام</button>
            </div>
        </div>

        <div id="waiting-lobby" class="hidden">
            <div class="bg-slate-900/50 p-10 rounded-[40px] border border-white/5 mb-8">
                <p class="text-slate-400 text-sm mb-4 uppercase">رقم الغرفة</p>
                <h2 id="room-id-display" class="text-7xl font-black tracking-widest text-white">0000</h2>
            </div>
            <p class="animate-pulse text-pink-400 font-bold">بانتظار الطرف الآخر للدخول...</p>
        </div>
    </div>

    <div id="game-screen" class="hidden fixed inset-0 flex flex-col p-6">
        <div class="flex justify-between items-center mb-10">
            <div class="bg-slate-900 px-6 py-3 rounded-2xl border-b-4 border-pink-500 text-center">
                <div class="text-[10px] text-pink-500 font-bold">زينبي</div>
                <div id="z-score" class="text-3xl font-black italic">0</div>
            </div>
            <div id="role-tag" class="text-[10px] font-bold px-4 py-1 bg-white/5 rounded-full border border-white/10">...</div>
            <div class="bg-slate-900 px-6 py-3 rounded-2xl border-b-4 border-cyan-500 text-center">
                <div class="text-[10px] text-cyan-500 font-bold">فوفو</div>
                <div id="f-score" class="text-3xl font-black italic">0</div>
            </div>
        </div>
        <div class="flex-1 flex items-center justify-center relative" onmousedown="kick()" ontouchstart="kick()">
            <div class="w-full max-w-[320px] h-[400px] bg-slate-900/40 rounded-[50px] relative border border-white/5 overflow-hidden">
                <div id="ball">⚽</div>
                <div class="absolute top-1/2 left-0 w-full h-[1px] bg-white/5"></div>
            </div>
        </div>
        <p class="text-center text-slate-500 text-[10px] mt-6 font-bold uppercase tracking-widest">المس الشاشة لضرب الكرة</p>
    </div>

</body>
</html>
