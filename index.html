
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الطقس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        
        .weather-bg { 
            background: linear-gradient(180deg, #2c3e50 0%, #3498db 50%, #2980b9 100%); 
            background-attachment: fixed;
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }
        
        .tab-active { 
            background: white !important; 
            color: #ec4899 !important; 
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.2); 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
        
        /* تحسين ملمس الأزرار عند الضغط */
        button:active { transform: scale(0.95); opacity: 0.8; }
    </style>
</head>
<body class="weather-bg h-[100dvh] overflow-hidden m-0 p-0 text-white">

    <!-- شاشة الطقس (الواجهة الزجاجية) -->
    <div id="lock-screen" class="flex flex-col items-center h-full w-full p-6 pt-12 transition-all duration-700">
        <div class="text-center mb-6">
            <h2 class="text-3xl font-medium mb-1">بغداد</h2>
            <h1 class="text-[90px] font-thin leading-none">31°</h1>
            <p class="text-lg opacity-80 font-light italic">مشمس جزئياً</p>
        </div>

        <div class="w-full max-w-[340px] relative mb-10">
            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-white/40 w-5 h-5"></i>
            <input type="text" id="pass-input" placeholder="ابحث عن مدينة أو رمز بريدي" 
                class="w-full py-4 px-12 rounded-[2rem] bg-black/10 border border-white/10 focus:outline-none focus:bg-black/20 text-right text-sm shadow-inner transition-all">
        </div>

        <div class="grid grid-cols-2 gap-4 w-full max-w-[340px] mb-8">
            <div class="glass-card rounded-[2rem] p-4 text-center">
                <div class="flex items-center justify-center gap-2 opacity-60 text-[10px] mb-1">
                    <i data-lucide="wind" class="w-3 h-3"></i> <span>الرياح</span>
                </div>
                <span class="text-lg font-bold">12 كم/س</span>
            </div>
            <div class="glass-card rounded-[2rem] p-4 text-center">
                <div class="flex items-center justify-center gap-2 opacity-60 text-[10px] mb-1">
                    <i data-lucide="droplets" class="w-3 h-3"></i> <span>الرطوبة</span>
                </div>
                <span class="text-lg font-bold">10%</span>
            </div>
        </div>

        <div class="glass-card w-full max-w-[340px] rounded-[2rem] p-5">
            <p class="text-[10px] opacity-60 border-b border-white/10 pb-2 mb-3">توقعات الساعات القادمة</p>
            <div class="flex justify-between gap-2 overflow-x-auto">
                <div class="flex flex-col items-center min-w-[50px]"><span class="text-[10px]">الآن</span><i data-lucide="sun" class="w-4 h-4 my-2 text-yellow-300"></i><span class="font-bold">31°</span></div>
                <div class="flex flex-col items-center min-w-[50px]"><span class="text-[10px]">4م</span><i data-lucide="sun" class="w-4 h-4 my-2 text-yellow-300"></i><span class="font-bold">33°</span></div>
                <div class="flex flex-col items-center min-w-[50px]"><span class="text-[10px]">10م</span><i data-lucide="moon" class="w-4 h-4 my-2 text-blue-200"></i><span class="font-bold">24°</span></div>
            </div>
        </div>
    </div>

    <!-- شاشة "عالمنا" السرية -->
    <div id="private-screen" class="hidden h-full bg-[#FFF9FB] flex flex-col text-gray-900">
        <header class="bg-white px-4 py-4 flex justify-between items-center border-b border-pink-50 shadow-sm z-50">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-pink-500 rounded-full flex items-center justify-center shadow-lg">
                    <i data-lucide="heart" class="text-white fill-white w-5 h-5"></i>
                </div>
                <span class="font-black text-xl text-gray-800">عالمنا</span>
            </div>
            
            <div class="flex bg-gray-100 p-1 rounded-[1.2rem]">
                <button onclick="showTab('chat')" id="btn-chat" class="px-4 py-2 rounded-xl text-[10px] font-bold transition-all tab-active">الدردشة</button>
                <button onclick="showTab('posts')" id="btn-posts" class="px-4 py-2 rounded-xl text-[10px] font-bold transition-all text-gray-400">الذكريات</button>
                <button onclick="showTab('music')" id="btn-music" class="px-4 py-2 rounded-xl text-[10px] font-bold transition-all text-gray-400">الأغاني</button>
            </div>
        </header>

        <main class="flex-1 flex flex-col overflow-hidden w-full max-w-md mx-auto bg-white relative">
            <!-- إشعار حالة الاتصال -->
            <div id="conn-toast" class="absolute top-2 left-1/2 -translate-x-1/2 bg-green-500 text-white text-[10px] px-4 py-1.5 rounded-full shadow-lg opacity-0 transition-opacity z-[100] pointer-events-none">
                متصل بنجاح ✅
            </div>

            <!-- محتوى الدردشة -->
            <div id="tab-chat" class="flex flex-col h-full bg-gray-50/50">
                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
                <div class="p-4 bg-white border-t border-pink-50 flex gap-2 pb-10">
                    <input type="text" id="msg-input" placeholder="اكتب شيئاً..." class="flex-1 bg-gray-50 border border-gray-100 rounded-2xl px-5 py-3.5 text-sm focus:ring-2 focus:ring-pink-200 outline-none text-gray-800">
                    <button type="button" id="send-btn" class="bg-pink-500 text-white p-4 rounded-2xl shadow-xl transition-all">
                        <i data-lucide="send" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- محتوى المنشورات -->
            <div id="tab-posts" class="hidden h-full overflow-y-auto p-4 space-y-6 bg-pink-50/20 pb-24">
                <div class="bg-white p-5 rounded-[2rem] shadow-sm border border-pink-100">
                    <textarea id="post-content" placeholder="اكتب ذكرى جديدة هنا..." class="w-full resize-none border-none focus:ring-0 text-sm font-medium text-gray-800" rows="2"></textarea>
                    <div class="flex items-center gap-2 border-t pt-4 mt-2">
                        <input type="text" id="post-image" placeholder="رابط صورة (اختياري)" class="flex-1 text-[10px] outline-none bg-gray-50 rounded-xl px-3 py-2.5">
                        <button type="button" id="post-btn" class="bg-pink-500 text-white px-6 py-2.5 rounded-xl text-[10px] font-black">نشر</button>
                    </div>
                </div>
                <div id="posts-list" class="space-y-5"></div>
            </div>

            <!-- محتوى الموسيقى -->
            <div id="tab-music" class="hidden h-full overflow-y-auto p-4 space-y-6 bg-slate-950 text-white pb-24">
                <div class="bg-white/5 backdrop-blur-lg p-6 rounded-[2rem] border border-white/10">
                    <input type="text" id="song-title" placeholder="اسم الأغنية" class="w-full bg-white/5 rounded-xl px-4 py-3 mb-3 outline-none text-xs border border-white/10">
                    <input type="text" id="song-url" placeholder="رابط فيديو يوتيوب" class="w-full bg-white/5 rounded-xl px-4 py-3 mb-4 outline-none text-xs border border-white/10">
                    <button type="button" id="song-btn" class="w-full bg-pink-500 py-3.5 rounded-xl font-bold text-xs">إضافة للقائمة</button>
                </div>
                <div id="songs-list" class="space-y-6"></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        let db, auth, currentUser = null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'weather-secret-v4-fix';

        lucide.createIcons();

        // فحص كلمة السر تلقائياً
        document.getElementById('pass-input').addEventListener('input', (e) => {
            if (e.target.value.trim() === 'فؤاد') {
                document.getElementById('lock-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('lock-screen').classList.add('hidden');
                    document.getElementById('private-screen').classList.remove('hidden');
                    document.body.className = "h-[100dvh] overflow-hidden m-0 p-0";
                    initFirebase();
                }, 400);
            }
        });

        async function initFirebase() {
            try {
                const config = JSON.parse(__firebase_config);
                const app = initializeApp(config);
                db = getFirestore(app);
                auth = getAuth(app);

                await signInAnonymously(auth);
                
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        const toast = document.getElementById('conn-toast');
                        toast.style.opacity = '1';
                        setTimeout(() => toast.style.opacity = '0', 3000);
                        startSyncing();
                    }
                });
            } catch (err) {
                console.error("Firebase Error:", err);
            }
        }

        function startSyncing() {
            // مزامنة الدردشة (ترتيب حسب الوقت)
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), (snap) => {
                const msgs = snap.docs.map(d => d.data()).sort((a,b) => a.timestamp - b.timestamp);
                const container = document.getElementById('chat-messages');
                container.innerHTML = msgs.map(m => `
                    <div class="flex ${m.sender === currentUser.uid ? 'justify-end' : 'justify-start'} animate-fade">
                        <div class="max-w-[85%] px-4 py-3 rounded-2xl shadow-sm text-sm font-medium ${m.sender === currentUser.uid ? 'bg-pink-500 text-white rounded-tl-none' : 'bg-gray-100 text-gray-700 border border-gray-200 rounded-tr-none'}">
                            ${m.text}
                            <div class="text-[8px] mt-1 opacity-50 block text-left">${new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
                        </div>
                    </div>
                `).join('');
                container.scrollTop = container.scrollHeight;
            });

            // مزامنة المنشورات
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), (snap) => {
                const pts = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => b.timestamp - a.timestamp);
                document.getElementById('posts-list').innerHTML = pts.map(p => `
                    <div class="bg-white rounded-[2rem] overflow-hidden shadow-sm border border-pink-100 p-6 text-right animate-fade">
                        <p class="text-gray-800 leading-relaxed mb-4 text-sm font-semibold">${p.content}</p>
                        ${p.imageUrl ? `<img src="${p.imageUrl}" class="w-full rounded-2xl object-cover shadow-sm max-h-80" onerror="this.style.display='none'">` : ''}
                        <div class="mt-3 text-[9px] text-gray-400 font-bold uppercase tracking-tighter">${new Date(p.timestamp).toLocaleDateString('ar-EG')}</div>
                    </div>
                `).join('');
            });

            // مزامنة الأغاني
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'songs'), (snap) => {
                const sgs = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => b.timestamp - a.timestamp);
                document.getElementById('songs-list').innerHTML = sgs.map(s => `
                    <div class="bg-white/5 rounded-[2rem] overflow-hidden border border-white/10 animate-fade">
                        <div class="p-4 flex justify-between items-center text-right">
                            <button onclick="window.deleteItem('songs', '${s.id}')" class="text-white/20 hover:text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            <span class="font-bold text-[10px] text-pink-300">${s.title}</span>
                        </div>
                        <iframe src="${s.url}" class="w-full aspect-video" frameborder="0" allowfullscreen></iframe>
                    </div>
                `).join('');
                lucide.createIcons();
            });
        }

        // --- أزرار الإرسال المباشرة ---

        // إرسال رسالة
        const sendMessage = async () => {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text || !currentUser) return;
            
            try {
                input.value = ''; // تفريغ فوري لتجربة مستخدم سريعة
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
                    text: text,
                    sender: currentUser.uid,
                    timestamp: Date.now()
                });
            } catch (e) { console.error("Send Error:", e); }
        };

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('msg-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // نشر ذكرى
        const createPost = async () => {
            const contentInput = document.getElementById('post-content');
            const imageInput = document.getElementById('post-image');
            const content = contentInput.value.trim();
            const image = imageInput.value.trim();
            
            if(!content || !currentUser) return;

            try {
                contentInput.value = '';
                imageInput.value = '';
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), {
                    content, imageUrl: image, timestamp: Date.now()
                });
            } catch (e) { console.error("Post Error:", e); }
        };

        document.getElementById('post-btn').addEventListener('click', createPost);

        // إضافة أغنية
        const addSong = async () => {
            const titleInput = document.getElementById('song-title');
            const urlInput = document.getElementById('song-url');
            let url = urlInput.value.trim();
            const title = titleInput.value.trim();

            if(!url || !currentUser) return;

            try {
                if(url.includes('watch?v=')) url = url.replace('watch?v=', 'embed/').split('&')[0];
                else if(url.includes('youtu.be/')) url = 'https://www.youtube.com/embed/' + url.split('/').pop();
                
                titleInput.value = '';
                urlInput.value = '';
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'songs'), {
                    title: title || 'لحن جميل', url, timestamp: Date.now()
                });
            } catch (e) { console.error("Song Error:", e); }
        };

        document.getElementById('song-btn').addEventListener('click', addSong);

        // تبديل التبويبات
        window.showTab = (tab) => {
            ['chat', 'posts', 'music'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).classList.remove('tab-active');
                document.getElementById(`btn-${t}`).classList.add('text-gray-400');
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).classList.add('tab-active');
            lucide.createIcons();
        };

        window.deleteItem = async (col, id) => {
            if(confirm("هل تريد مسح هذا العنصر؟")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', col, id));
            }
        };
    </script>
</body>
</html>

```
