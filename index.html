
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>زينبي وفوفو - النسخة النهائية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrLUiTNZL3vJ10RzqQVBC2UUMlhQRmB18",
            authDomain: "arenstore-71e49.firebaseapp.com",
            projectId: "arenstore-71e49",
            storageBucket: "arenstore-71e49.firebasestorage.app",
            messagingSenderId: "221262833085",
            appId: "1:221262833085:web:68e17371c7100e1053ded4",
            measurementId: "G-1Q957K0Y1V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = 'arenstore_pro_v3';

        let user = null;
        let gameId = null;
        let myRole = 'z'; 
        let isHost = false;
        let isBotMode = false;
        let unsubscribe = null;
        let currentData = null;
        let transitionLocked = false;

        onAuthStateChanged(auth, (u) => { 
            if (u) { user = u; document.getElementById('loading').classList.add('hidden'); }
            else { signInAnonymously(auth); }
        });

        window.startBotMode = () => {
            isBotMode = true; isHost = true; myRole = 'z'; transitionLocked = false;
            currentData = {
                gameType: 'none', status: 'lobby',
                xo: { board: Array(9).fill(""), turn: "z" },
                speed: { score: 50, winner: null },
                dots: { lines: [], boxes: [], turn: 'z', scores: { z: 0, f: 0 } }
            };
            showView('game-selector');
        };

        window.createRoom = async () => {
            isBotMode = false; transitionLocked = false;
            const rid = Math.floor(1000 + Math.random() * 9999).toString();
            gameId = `room_${rid}`;
            myRole = 'z'; isHost = true;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), {
                roomId: rid, z_id: user.uid, status: 'waiting', gameType: 'none',
                xo: { board: Array(9).fill(""), turn: "z" },
                speed: { score: 50, winner: null },
                dots: { lines: [], boxes: [], turn: 'z', scores: { z: 0, f: 0 } }
            });
            document.getElementById('room-id').innerText = rid;
            showView('waiting-room');
            listen();
        };

        window.joinRoom = async () => {
            isBotMode = false;
            const rid = document.getElementById('room-input').value;
            if (!rid) return;
            gameId = `room_${rid}`;
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId);
            const snap = await getDoc(ref);
            if (snap.exists()) {
                myRole = 'f'; isHost = false;
                await updateDoc(ref, { f_id: user.uid, status: 'lobby' });
                listen();
            } else { alert("الغرفة غير موجودة"); }
        };

        function listen() {
            if (unsubscribe) unsubscribe();
            unsubscribe = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), (s) => {
                if (!s.exists()) { exit(); return; }
                currentData = s.data();
                if (currentData.status === 'lobby') showView('game-selector');
                else if (currentData.status === 'playing') renderGame();
            });
        }

        function showView(id) {
            ['main-menu', 'waiting-room', 'game-selector', 'game-view'].forEach(v => document.getElementById(v)?.classList.add('hidden'));
            document.getElementById(id)?.classList.remove('hidden');
        }

        window.selectGame = async (type) => {
            transitionLocked = false;
            const initialData = {
                gameType: type, 
                status: (type === 'none' ? 'lobby' : 'playing'),
                xo: { board: Array(9).fill(""), turn: "z" },
                speed: { score: 50, winner: null },
                dots: { lines: [], boxes: [], turn: 'z', scores: { z: 0, f: 0 } }
            };
            if (isBotMode) {
                currentData = { ...currentData, ...initialData };
                renderGame();
                if (type === 'none') showView('game-selector');
                return;
            }
            if (!isHost) return;
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), initialData);
        };

        function renderGame() {
            showView('game-view');
            const type = currentData.gameType;
            if (type === 'xo') renderXO();
            else if (type === 'speed') renderSpeed();
            else if (type === 'dots') renderDots();
            else if (type === 'none') showView('game-selector');
        }

        // --- XO Logic ---
        function checkWinnerXO(board) {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let w of wins) {
                if (board[w[0]] && board[w[0]] === board[w[1]] && board[w[0]] === board[w[2]]) return board[w[0]];
            }
            return board.includes("") ? null : "draw";
        }

        function renderXO() {
            const xo = currentData.xo;
            const winner = checkWinnerXO(xo.board);
            if (winner && !transitionLocked) {
                transitionLocked = true;
                const msg = winner === 'draw' ? "تعادل!" : `فوز ${winner === 'z' ? 'زينبي' : 'فوفو'}!`;
                document.getElementById('content').innerHTML = `<div class="text-center py-20 animate-bounce"><h2 class="text-4xl font-black text-cyan-400">${msg}</h2></div>`;
                setTimeout(() => selectGame('none'), 2500);
                return;
            }
            if (transitionLocked) return;
            let html = `<div class="mb-6 text-center text-pink-500 font-bold">${xo.turn === myRole ? 'دورك الآن' : 'انتظر الخصم...'}</div>`;
            html += `<div class="grid grid-cols-3 gap-3 w-72 mx-auto">`;
            xo.board.forEach((cell, i) => {
                html += `<button onclick="playXO(${i})" class="h-20 bg-slate-800 rounded-2xl text-4xl font-black shadow-lg">${cell === 'z' ? '❌' : (cell === 'f' ? '⭕' : '')}</button>`;
            });
            html += `</div>`;
            document.getElementById('content').innerHTML = html;
            if (isBotMode && xo.turn === 'f' && !winner) setTimeout(botXO, 600);
        }
        window.playXO = async (i) => {
            if (transitionLocked || currentData.xo.turn !== myRole || currentData.xo.board[i] !== "") return;
            const b = [...currentData.xo.board]; b[i] = myRole;
            const t = myRole === 'z' ? 'f' : 'z';
            if (isBotMode) { currentData.xo.board = b; currentData.xo.turn = t; renderXO(); }
            else await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), { "xo.board": b, "xo.turn": t });
        };
        function botXO() {
            const empty = currentData.xo.board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            if (empty.length) playXO(empty[Math.floor(Math.random() * empty.length)]);
        }

        // --- Speed Challenge (Winner Added) ---
        function renderSpeed() {
            const score = currentData.speed.score;
            let win = null;
            if (score <= 0) win = 'z';
            if (score >= 100) win = 'f';

            if (win && !transitionLocked) {
                transitionLocked = true;
                const msg = `الفائز هو ${win === 'z' ? 'زينبي' : 'فوفو'}!`;
                document.getElementById('content').innerHTML = `<div class="text-center py-20 animate-pulse"><h2 class="text-4xl font-black text-yellow-400">${msg}</h2></div>`;
                setTimeout(() => selectGame('none'), 3000);
                return;
            }

            document.getElementById('content').innerHTML = `
                <div class="text-center mb-10"><h3 class="text-2xl font-black italic">تحدي الضغط</h3></div>
                <div class="relative w-full h-24 bg-slate-900 rounded-[2.5rem] p-3 border-4 border-white/5 overflow-hidden shadow-inner">
                    <div class="absolute h-full top-0 bg-gradient-to-l from-pink-500 to-cyan-500 transition-all duration-150 ease-out" style="width: ${score}%; left: 0;"></div>
                    <div class="absolute inset-0 flex items-center justify-between px-10 font-black text-sm italic tracking-widest mix-blend-difference text-white">
                        <span>ZINABI</span> <span>FOFO</span>
                    </div>
                </div>
                <div class="mt-20 flex justify-center">
                    <button id="tap-btn" class="w-56 h-56 bg-pink-600 rounded-full shadow-[0_25px_80px_rgba(219,39,119,0.5)] border-b-[15px] border-pink-900 active:border-b-0 active:translate-y-3 transition-all flex flex-col items-center justify-center text-6xl select-none">
                        <span>🔥</span>
                        <span class="text-[10px] font-black uppercase mt-2">اضغط بسرعة</span>
                    </button>
                </div>
            `;
            const btn = document.getElementById('tap-btn');
            const trigger = async (e) => {
                e.preventDefault();
                if (transitionLocked) return;
                let s = currentData.speed.score;
                const change = myRole === 'z' ? -3 : 3;
                s = Math.max(0, Math.min(100, s + change));
                if (isBotMode) { currentData.speed.score = s; renderSpeed(); }
                else await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), { "speed.score": s });
            };
            btn.addEventListener('touchstart', trigger, { passive: false });
            btn.addEventListener('mousedown', trigger);

            if (isBotMode && !window.botS) {
                window.botS = setInterval(() => {
                    if (currentData?.gameType === 'speed' && !transitionLocked) {
                        currentData.speed.score = Math.min(100, currentData.speed.score + 1.2);
                        renderSpeed();
                    }
                }, 100);
            }
        }

        // --- Dots and Boxes (Larger Grid + Names) ---
        function renderDots() {
            const d = currentData.dots;
            const size = 5; // 5x5 points = 4x4 boxes (16 squares)
            const gap = 60;
            const offset = 40;

            let html = `<div class="flex justify-between mb-8 px-4 font-black">
                <div class="text-pink-500 text-lg">زينبي: ${d.scores.z}</div>
                <div class="text-cyan-500 text-lg">فوفو: ${d.scores.f}</div>
            </div>`;
            
            html += `<div class="relative mx-auto bg-slate-900/50 p-6 rounded-[2.5rem] border border-white/10 shadow-2xl overflow-auto" style="width: 310px; height: 310px;">`;
            
            // Render Boxes with Names
            for(let r=0; r<size-1; r++) {
                for(let c=0; c<size-1; c++) {
                    const boxId = `b-${r}-${c}`;
                    const owner = d.boxes.find(b => b.id === boxId)?.owner;
                    const name = owner === 'z' ? 'زينبي' : 'فوفو';
                    const color = owner === 'z' ? 'bg-pink-500/20 text-pink-400' : 'bg-cyan-500/20 text-cyan-400';
                    
                    html += `<div class="absolute flex items-center justify-center transition-all duration-500 overflow-hidden" style="top:${r*gap + offset + 10}px; left:${c*gap + offset + 10}px; width:${gap-20}px; height:${gap-20}px; border-radius:12px;">
                        ${owner ? `<div class="${color} w-full h-full flex items-center justify-center text-[8px] font-black">${name}</div>` : ''}
                    </div>`;
                }
            }

            // Render Lines (Horizontal)
            for(let r=0; r<size; r++) {
                for(let c=0; c<size-1; c++) {
                    const lid = `h-${r}-${c}`;
                    const taken = d.lines.includes(lid);
                    html += `<div onclick="clickLine('${lid}')" class="absolute cursor-pointer group" style="top:${r*gap + offset + 2}px; left:${c*gap + offset + 10}px; width:${gap-20}px; height:6px;">
                        <div class="w-full h-full rounded-full transition-all ${taken ? 'bg-white shadow-[0_0_8px_white]' : 'bg-white/5 group-hover:bg-white/20'}"></div>
                    </div>`;
                }
            }
            // Render Lines (Vertical)
            for(let r=0; r<size-1; r++) {
                for(let c=0; c<size; c++) {
                    const lid = `v-${r}-${c}`;
                    const taken = d.lines.includes(lid);
                    html += `<div onclick="clickLine('${lid}')" class="absolute cursor-pointer group" style="top:${r*gap + offset + 10}px; left:${c*gap + offset + 2}px; width:6px; height:${gap-20}px;">
                        <div class="w-full h-full rounded-full transition-all ${taken ? 'bg-white shadow-[0_0_8px_white]' : 'bg-white/5 group-hover:bg-white/20'}"></div>
                    </div>`;
                }
            }
            // Render Dots
            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    html += `<div class="absolute bg-slate-400 w-2.5 h-2.5 rounded-full border border-white/20" style="top:${r*gap + offset}px; left:${c*gap + offset}px;"></div>`;
                }
            }
            html += `</div>`;
            html += `<div class="mt-6 text-center text-[10px] font-bold ${d.turn === myRole ? 'text-green-400' : 'text-slate-500'}">
                ${d.turn === myRole ? 'دورك الآن: حدد خطاً' : 'انتظر الخصم...'}
            </div>`;
            
            document.getElementById('content').innerHTML = html;

            if (isBotMode && d.turn === 'f') setTimeout(botDots, 1000);

            // Check End of Game
            if (d.boxes.length === (size-1)*(size-1) && !transitionLocked) {
                transitionLocked = true;
                const winMsg = d.scores.z > d.scores.f ? "زينبي فازت!" : (d.scores.f > d.scores.z ? "فوفو فازت!" : "تعادل!");
                document.getElementById('content').innerHTML += `<div class="fixed inset-0 bg-slate-950/90 flex flex-col items-center justify-center z-50 p-8 text-center"><h2 class="text-4xl font-black text-white mb-4">${winMsg}</h2><p class="text-slate-400">سيتم العودة للقائمة تلقائياً</p></div>`;
                setTimeout(() => selectGame('none'), 3500);
            }
        }

        window.clickLine = async (lid) => {
            const d = currentData.dots;
            if (d.turn !== myRole || d.lines.includes(lid) || transitionLocked) return;
            
            d.lines.push(lid);
            let closedAny = false;
            for(let r=0; r<4; r++) {
                for(let c=0; c<4; c++) {
                    const bid = `b-${r}-${c}`;
                    if (!d.boxes.find(b => b.id === bid)) {
                        const req = [`h-${r}-${c}`, `h-${r+1}-${c}`, `v-${r}-${c}`, `v-${r}-${c+1}`];
                        if (req.every(l => d.lines.includes(l))) {
                            d.boxes.push({ id: bid, owner: myRole });
                            d.scores[myRole]++;
                            closedAny = true;
                        }
                    }
                }
            }
            if (!closedAny) d.turn = (myRole === 'z' ? 'f' : 'z');
            
            if (isBotMode) renderDots();
            else await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), { dots: d });
        };

        function botDots() {
            const d = currentData.dots;
            const allPossible = [];
            for(let r=0; r<5; r++) for(let c=0; c<4; c++) allPossible.push(`h-${r}-${c}`);
            for(let r=0; r<4; r++) for(let c=0; c<5; c++) allPossible.push(`v-${r}-${c}`);
            const avail = allPossible.filter(l => !d.lines.includes(l));
            if (avail.length && d.turn === 'f') {
                const move = avail[Math.floor(Math.random() * avail.length)];
                const currentMe = myRole;
                myRole = 'f';
                window.clickLine(move);
                myRole = currentMe;
            }
        }

        window.exit = () => {
            if (window.botS) clearInterval(window.botS); window.botS = null;
            exitToMenu();
        };

        function exitToMenu() {
            if (unsubscribe) unsubscribe();
            gameId = null; isBotMode = false; showView('main-menu');
        }
    </script>
    <style>

</head>
