
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ألعاب زينبي و فوفو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, getDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrLUiTNZL3vJ10RzqQVBC2UUMlhQRmB18",
            authDomain: "arenstore-71e49.firebaseapp.com",
            projectId: "arenstore-71e49",
            storageBucket: "arenstore-71e49.firebasestorage.app",
            messagingSenderId: "221262833085",
            appId: "1:221262833085:web:68e17371c7100e1053ded4",
            measurementId: "G-1Q957K0Y1V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = 'arenstore_multi_games_v1';

        let user = null;
        let gameId = null;
        let myRole = null; 
        let isHost = false;
        let currentRoomData = null;
        let unsubscribe = null;

        onAuthStateChanged(auth, (u) => { 
            if (u) { user = u; document.getElementById('loading-overlay').classList.add('hidden'); }
            else { signInAnonymously(auth); }
        });

        // نظام الغرف
        window.createRoom = async () => {
            const rid = Math.floor(1000 + Math.random() * 9000).toString();
            gameId = `room_${rid}`;
            myRole = 'z'; isHost = true;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), {
                roomId: rid, z_id: user.uid, status: 'waiting', gameType: 'none',
                xo: { board: Array(9).fill(""), turn: "z" },
                tug: { score: 0 },
                house: { z_houses: 0, f_houses: 0, winner: null }
            });
            document.getElementById('room-id-display').innerText = rid;
            showView('waiting-room');
            listen();
        };

        window.joinRoom = async () => {
            const rid = document.getElementById('room-input').value;
            if (!rid) return;
            gameId = `room_${rid}`;
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId);
            const snap = await getDoc(ref);
            if (snap.exists()) {
                myRole = 'f'; isHost = false;
                await updateDoc(ref, { f_id: user.uid, status: 'lobby' });
                listen();
            } else { alert("الغرفة غير موجودة"); }
        };

        function listen() {
            if (unsubscribe) unsubscribe();
            unsubscribe = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), (s) => {
                if (!s.exists()) { exitToMenu(); return; }
                currentRoomData = s.data();
                handleNavigation(currentRoomData);
            });
        }

        function handleNavigation(data) {
            if (data.status === 'lobby') showView('game-selector');
            else if (data.status === 'playing') {
                if (data.gameType === 'xo') renderXO();
                else if (data.gameType === 'tug') renderTug();
                else if (data.gameType === 'house') renderHouse();
                showView('game-screen');
            }
        }

        function showView(id) {
            ['main-menu', 'waiting-room', 'game-selector', 'game-screen'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // اختيار اللعبة (للمستضيف فقط)
        window.selectGame = async (type) => {
            if (!isHost) return;
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), {
                gameType: type, status: 'playing',
                xo: { board: Array(9).fill(""), turn: "z" },
                tug: { score: 0 },
                house: { z_houses: 0, f_houses: 0, winner: null }
            });
        };

        // --- منطق لعبة XO ---
        function renderXO() {
            const container = document.getElementById('game-content');
            const xoData = currentRoomData.xo;
            let html = `<div class="text-center mb-4 font-bold">${xoData.turn === 'z' ? 'دور زينبي' : 'دور فوفو'}</div>`;
            html += `<div class="grid grid-cols-3 gap-2 w-64 mx-auto">`;
            xoData.board.forEach((cell, i) => {
                html += `<button onclick="playXO(${i})" class="h-20 w-20 bg-slate-800 rounded-xl text-3xl font-black">${cell === 'z' ? 'X' : (cell === 'f' ? 'O' : '')}</button>`;
            });
            html += `</div>`;
            container.innerHTML = html;
        }
        window.playXO = async (i) => {
            const xo = currentRoomData.xo;
            if (xo.turn !== myRole || xo.board[i] !== "") return;
            xo.board[i] = myRole;
            xo.turn = myRole === 'z' ? 'f' : 'z';
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), { xo });
        };

        // --- منطق جر الحبل (السرعة) ---
        function renderTug() {
            const score = currentRoomData.tug.score;
            document.getElementById('game-content').innerHTML = `
                <div class="text-center mb-8">اسحب الخط لجهتك بالضغط السريع!</div>
                <div class="relative w-full h-12 bg-slate-800 rounded-full overflow-hidden">
                    <div id="tug-line" class="absolute h-full w-2 bg-pink-500 transition-all duration-100" style="left: calc(50% + ${score}px)"></div>
                </div>
                <button onclick="pressTug()" class="mt-10 w-32 h-32 bg-pink-600 rounded-full font-black text-xl shadow-xl active:scale-90 mx-auto block">اضغط!</button>
            `;
        }
        window.pressTug = async () => {
            let score = currentRoomData.tug.score;
            score += (myRole === 'z' ? -10 : 10);
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), { "tug.score": score });
        };

        // --- منطق تجميع البيوت ---
        function renderHouse() {
            const h = currentRoomData.house;
            document.getElementById('game-content').innerHTML = `
                <div class="flex justify-around mb-8">
                    <div class="text-center">🏠 زينبي: ${h.z_houses}</div>
                    <div class="text-center">🏠 فوفو: ${h.f_houses}</div>
                </div>
                <div class="grid grid-cols-4 gap-4">
                    ${Array(12).fill(0).map((_, i) => `<button onclick="collectHouse()" class="h-16 bg-slate-800 rounded-lg text-2xl">🏠</button>`).join('')}
                </div>
            `;
        }
        window.collectHouse = async () => {
            const field = myRole === 'z' ? "house.z_houses" : "house.f_houses";
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId), { [field]: currentRoomData.house[myRole === 'z' ? 'z_houses' : 'f_houses'] + 1 });
        };

        window.exitToMenu = async () => {
            if (isHost && gameId) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', gameId));
            if (unsubscribe) unsubscribe();
            gameId = null; isHost = false; showView('main-menu');
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: white; overflow: hidden; touch-action: none; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="h-screen flex items-center justify-center">

    <div id="loading-overlay" class="fixed inset-0 z-[2000] bg-slate-950 flex flex-col items-center justify-center">
        <div class="w-10 h-10 border-4 border-pink-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p>جاري الاتصال...</p>
    </div>

    <!-- القائمة الرئيسية -->
    <div id="main-menu" class="w-full max-w-sm p-6 text-center">
        <h1 class="text-5xl font-black mb-12 italic bg-gradient-to-r from-pink-500 to-cyan-500 bg-clip-text text-transparent">زينبي و فوفو</h1>
        <button onclick="createRoom()" class="w-full py-5 bg-pink-600 rounded-3xl font-black text-xl mb-4 shadow-xl active:scale-95">إنشاء غرفة</button>
        <div class="flex gap-2">
            <input id="room-input" type="number" placeholder="رقم الغرفة" class="flex-1 bg-slate-900 border border-slate-800 rounded-3xl px-6 py-4 text-center font-bold outline-none">
            <button onclick="joinRoom()" class="px-8 py-4 bg-cyan-600 rounded-3xl font-black active:scale-95">دخول</button>
        </div>
    </div>

    <!-- شاشة الانتظار -->
    <div id="waiting-room" class="hidden text-center p-6">
        <div class="glass p-10 rounded-[40px] mb-8 relative">
            <button onclick="exitToMenu()" class="absolute top-4 right-4 text-slate-500">✕</button>
            <p class="text-slate-400 mb-2">رقم الغرفة</p>
            <h2 id="room-id-display" class="text-7xl font-black tracking-widest">0000</h2>
        </div>
        <p class="animate-pulse text-pink-400">بانتظار الطرف الآخر...</p>
    </div>

    <!-- اختيار اللعبة -->
    <div id="game-selector" class="hidden w-full max-w-sm p-6 text-center">
        <h2 class="text-2xl font-black mb-8">اختر اللعبة</h2>
        <div class="space-y-4">
            <button onclick="selectGame('xo')" class="w-full py-4 bg-slate-800 rounded-2xl font-bold hover:bg-pink-600 transition-colors">لعبة X-O</button>
            <button onclick="selectGame('tug')" class="w-full py-4 bg-slate-800 rounded-2xl font-bold hover:bg-cyan-600 transition-colors">تحدي السرعة (جر الحبل)</button>
            <button onclick="selectGame('house')" class="w-full py-4 bg-slate-800 rounded-2xl font-bold hover:bg-orange-600 transition-colors">تجميع البيوت 🏠</button>
        </div>
        <p id="guest-msg" class="mt-6 text-slate-500 text-sm hidden">بانتظار اختيار المستضيف للعبة...</p>
    </div>

    <!-- شاشة اللعب -->
    <div id="game-screen" class="hidden fixed inset-0 flex flex-col items-center justify-center p-6 bg-slate-950">
        <button onclick="selectGame('none')" class="absolute top-4 left-4 bg-white/10 px-4 py-2 rounded-full text-xs">تغيير اللعبة ↩</button>
        <div id="game-content" class="w-full max-w-sm">
            <!-- محتوى اللعبة يظهر هنا -->
        </div>
    </div>

</body>
</html>
